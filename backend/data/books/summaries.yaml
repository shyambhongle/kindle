# Book summary plan: one book per day, in this order, starting on start_date.
# Loaded once into Postgres (table book_plan) when that table is empty. After that, edit the
# plan on the web dashboard (Books page): add books at the end, edit, or remove unread ones.
start_date: 2026-11-01
words: 5000
style: "Detailed but easy to understand. Explain almost every important concept with examples."
language: "Professional English: clear, polished, no needlessly complicated vocabulary."
priority: "All of the above: career growth, communication, human psychology, influence, confidence, discipline, wisdom and mental clarity."
reader: "A software engineer in Pune, India, working at a non-profit (Plant-for-the-Planet). Wants to think clearly, communicate well, understand people, make wise decisions and keep growing in career and life."
categories:
  "Career growth & professional success": "Become more valuable professionally, improve your technical career and develop a long-term career strategy."
  "Communication, speaking & social skills": "Become articulate, express your thoughts clearly, listen better and communicate confidently at work and socially."
  "Human psychology & understanding people": "Understand human behaviour, emotions, cognitive biases, motivations and social dynamics."
  "Persuasion, negotiation & influence": "Become persuasive, negotiate better, recognise manipulation and influence people ethically."
  "Growth mindset, discipline & self-improvement": "Become someone who keeps improving, learns from mistakes and doesn't give up easily."
  "Confidence, self-esteem & personality": "Become comfortable with yourself, overcome self-doubt and develop a stronger personality."
  "Wisdom, philosophy & handling difficult times": "Develop sound judgment, understand life, become resilient and respond thoughtfully to challenges."
  "Mental clarity, emotional control & inner peace": "Reduce unnecessary overthinking, develop emotional awareness, stay calm and improve focus."
books:
  - title: "So Good They Can't Ignore You"
    author: "Cal Newport"
    category: "Career growth & professional success"
    why: "Learn why developing rare and valuable skills is more useful than simply following your passion."
  - title: "The Pragmatic Programmer"
    author: "David Thomas and Andrew Hunt"
    category: "Career growth & professional success"
    why: "Develop better engineering habits, problem-solving skills and professional judgment."
  - title: "Staff Engineer"
    author: "Will Larson"
    category: "Career growth & professional success"
    why: "Understand technical leadership, engineering influence and career progression without necessarily becoming a manager."
  - title: "The First 90 Days"
    author: "Michael D. Watkins"
    category: "Career growth & professional success"
    why: "Learn how to transition into new roles, establish credibility and deliver results."
  - title: "Deep Work"
    author: "Cal Newport"
    category: "Career growth & professional success"
    why: "Learn to concentrate deeply and produce high-quality work without constant distractions."
  - title: "How to Win Friends and Influence People"
    author: "Dale Carnegie"
    category: "Communication, speaking & social skills"
    why: "Understand how to build relationships, make people feel valued and communicate effectively."
  - title: "How to Talk to Anyone"
    author: "Leil Lowndes"
    category: "Communication, speaking & social skills"
    why: "Learn conversation techniques, social confidence and how to connect with strangers."
  - title: "Nonviolent Communication"
    author: "Marshall B. Rosenberg"
    category: "Communication, speaking & social skills"
    why: "Learn to express your needs, understand others and handle disagreements without unnecessary conflict."
  - title: "Crucial Conversations"
    author: "Kerry Patterson, Joseph Grenny, Ron McMillan and Al Switzler"
    category: "Communication, speaking & social skills"
