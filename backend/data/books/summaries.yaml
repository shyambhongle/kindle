  - title: "Supercommunicators"
    author: "Charles Duhigg"
    category: "Communication, speaking & social skills"
    why: "Understand different types of conversations and how to create deeper connections."
  - title: "The Laws of Human Nature"
    author: "Robert Greene"
    category: "Human psychology & understanding people"
    why: "Explore human motivations, emotional reactions, personality and social behaviour."
  - title: "Thinking, Fast and Slow"
    author: "Daniel Kahneman"
    category: "Human psychology & understanding people"
