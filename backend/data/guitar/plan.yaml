# 6 month guitar plan, one entry per week. The backend shows the week in practice_state.current_week.
# Advance the week with: POST /api/practice/guitar/advance (or edit practice_state in Postgres).
- week: 1
  lesson: "Open chords: E, A, D"
  exercises:
    - "Finger stretches, 2 min"
    - "E to A to D, 4 beats each, 60 bpm"
    - "Strum pattern D DU UDU on E"
  notes: "Fingertips only. Thumb behind the neck."
- week: 2
  lesson: "Open chords: G, C, Em"
  exercises:
    - "Chromatic run on strings 6 to 1"
    - "G to C to Em to D, 60 bpm"
    - "Play 'Knockin on Heaven's Door' slowly"
  notes: "Keep the pinky down on G."
- week: 3
  lesson: "Strumming and timing"
  exercises:
    - "Metronome at 70 bpm, downstrokes only"
    - "D DU UDU on G and C"
    - "Mute strings with the palm between chords"
  notes: "Count out loud."
- week: 4
  lesson: "Chord switching speed"
  exercises:
    - "One minute changes: G to C, count them"
    - "One minute changes: C to D"
    - "Play along with a backing track"
  notes: "Aim for 40 changes a minute."
- week: 5
  lesson: "Am, Dm and minor songs"
  exercises:
    - "Am to Dm to E, 60 bpm"
    - "Play 'House of the Rising Sun' arpeggio"
  notes: ""
- week: 6
  lesson: "Fingerpicking basics"
  exercises:
    - "Thumb on bass, fingers on 3 2 1"
    - "Travis pattern on C and G"
  notes: "Rest the forearm on the body."
- week: 7
  lesson: "F chord, small version"
  exercises:
    - "Mini F on the top 4 strings"
    - "C to F to G, 50 bpm"
  notes: "Patience. This is the hard week."
- week: 8
  lesson: "Power chords"
  exercises:
    - "E5, A5, D5 on strings 6 and 5"
    - "Palm muted eighth notes at 80 bpm"
  notes: ""
- week: 9
  lesson: "Review and first song start to finish"
  exercises:
    - "Pick one song, play it three times"
    - "Record yourself once"
  notes: "Listen back and note two fixes."
- week: 10
  lesson: "Pentatonic scale, position 1"
  exercises:
    - "A minor pentatonic up and down, 60 bpm"
    - "Say the note names"
  notes: ""
- week: 11
  lesson: "Hammer ons and pull offs"
  exercises:
    - "Hammer on 5 to 7 on each string"
    - "Pull off 7 to 5"
  notes: "Keep the sound even."
- week: 12
  lesson: "Barre chords: F major shape"
  exercises:
    - "Warm up: chromatic run, 3 min"
    - "F barre: hold and release, 10 reps"
    - "Switch G to F to C, 60 bpm, 5 min"
    - "Play 'Wonderwall' chorus slowly"
  notes: "Thumb lower on the neck. Keep the wrist straight."
- week: 13
  lesson: "Barre chords: Bm shape"
  exercises:
    - "Bm barre at fret 2"
    - "G to Bm to Em to D"
  notes: ""
- week: 14
  lesson: "Moving barre shapes"
  exercises:
    - "F shape at frets 1, 3, 5, 7"
    - "Name each chord"
  notes: ""
- week: 15
  lesson: "Rhythm: sixteenth notes"
  exercises:
    - "1 e and a counting on a muted string"
    - "Funk strum on E9"
  notes: ""
- week: 16
  lesson: "Blues in A"
  exercises:
    - "12 bar blues shuffle, 70 bpm"
    - "Turnaround lick"
  notes: ""
- week: 17
  lesson: "Pentatonic position 2 and bends"
  exercises:
    - "Half step bends on string 3"
    - "Position 2 up and down"
  notes: "Use three fingers for bends."
- week: 18
  lesson: "Fingerstyle song"
  exercises:
    - "Learn the first 8 bars of a fingerstyle piece"
  notes: ""
- week: 19
  lesson: "Chord embellishments"
  exercises:
    - "Sus2 and sus4 on D and A"
    - "Add9 on C and G"
  notes: ""
- week: 20
  lesson: "Capo and transposing"
  exercises:
    - "Play a G shape song in three keys with the capo"
  notes: ""
- week: 21
  lesson: "Improvising over a backing track"
  exercises:
    - "A minor pentatonic over a 12 bar blues, 5 min"
    - "Leave space between phrases"
  notes: ""
- week: 22
  lesson: "Second full song"
  exercises:
    - "Pick a song with a barre chord"
    - "Play it with a metronome"
  notes: ""
- week: 23
  lesson: "Speed and cleanliness"
  exercises:
    - "Spider exercise at 80, 90, 100 bpm"
  notes: ""
- week: 24
  lesson: "Review month, record three songs"
  exercises:
    - "Record all three songs"
    - "Write down the next 6 month goals"
  notes: "Celebrate. You did six months."
- week: 25
  lesson: "Buffer week"
  exercises:
    - "Repeat anything weak"
  notes: ""
- week: 26
  lesson: "Buffer week"
  exercises:
    - "Repeat anything weak"
  notes: ""
