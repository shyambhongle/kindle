# German A1 to B2 in 365 days, Goethe-Zertifikat B2. One entry per week, transcribed from the plan.
# Loaded once (or with `dashboard import`); edit weeks on the dashboard's German course page afterwards.
start_date: 2026-11-02
exam_target: "Goethe-Zertifikat B2, Pune or Mumbai, October 2027"
weeks:
  - week: 1
    phase: A1
    grammar: "Alphabet and sounds (ä, ö, ü, ß, ch, r, final -en). sein and personal pronouns. Statement word order: verb in position 2"
    vocab: "Greetings, countries, languages, numbers 0 to 20"
    speaking: "Listen only. Ask them to say 10 words slowly; you repeat"
    saturday: "Spell your name and city aloud (record it), write 5 sentences about yourself"
  - week: 2
    phase: A1
    grammar: "Regular verb endings in present tense. haben. W-questions (wer, was, wo, woher, wie) and yes/no questions. Numbers to 100, telling the time"
    vocab: "Family, professions, time of day"
    speaking: "Ask 3 questions about their job and family; answer theirs"
    saturday: "Fill in a registration form (name, address, date of birth, nationality). Read a short notice and answer 3 questions"
  - week: 3
    phase: A1
    grammar: "Noun gender and the three articles. Indefinite article. Plural patterns (-e, -en, -er, -s, umlaut). Negation with nicht and kein"
    vocab: "Objects in the office and home, colours, adjectives for size"
    speaking: "German-only rule starts: 5 minutes a day, they correct you"
    saturday: "Write a 30-word message describing your desk or room"
  - week: 4
    phase: A1
    grammar: "Akkusativ: articles and pronouns. es gibt. Possessive articles (mein, dein, sein, ihr, unser). Verbs that take Akkusativ"
    vocab: "Food, drink, shopping, prices, units"
    speaking: "Buy something from them in a role play. Ask what they eat for breakfast"
    saturday: "Short dialogue in a shop or café (reading). Write a 30-word message inviting someone for lunch"
  - week: 5
    phase: A1
    grammar: "Modal verbs: können, müssen, wollen, möchten, dürfen. Sentence bracket (Satzklammer). Separable verbs (aufstehen, anrufen, einkaufen)"
    vocab: "Daily routine, days, months, seasons, time expressions"
    speaking: "Describe your day from waking up to sleeping"
    saturday: "Read a weekly schedule and answer questions. Write a 30-word message about your week"
  - week: 6
    phase: A1
    grammar: "Dativ: articles and pronouns. Prepositions with Dativ (aus, bei, mit, nach, seit, von, zu). Wo? versus Wohin? first look"
    vocab: "City, buildings, directions, transport"
    speaking: "Give directions from the office to a landmark"
    saturday: "Read 3 signs and match them to situations. Write a 30-word message asking for directions"
  - week: 7
    phase: A1
    grammar: "Perfekt with haben and sein. Partizip II: regular (ge-t) and 25 common irregular verbs. Time sequence words (zuerst, dann, danach)"
    vocab: "Weekend, free time, hobbies, weather"
    speaking: "Tell them what you did last weekend, 2 minutes"
    saturday: "Write a 40-word message about your weekend"
  - week: 8
    phase: A1
    grammar: "Imperative (du, ihr, Sie). Two-way prepositions with Wo? (Dativ) and Wohin? (Akkusativ). Time prepositions (am, um, im, von bis)"
    vocab: "Appointments, health, body parts, at the doctor"
    speaking: "Phone role play: make and change an appointment"
    saturday: "Read an email about an appointment and answer questions. Write a 40-word message cancelling an appointment"
  - week: 9
    phase: A1
    grammar: "Review week. Goethe A1 exam format: Lesen 3 parts, Hören 3 parts, Schreiben form plus 30-word message, Sprechen introduce yourself, ask and answer, make requests"
    vocab: "Review all themes. Fill gaps in Anki"
    speaking: "Full A1 speaking simulation with coworker, 15 minutes"
    saturday: "Checkpoint: Goethe A1 Modellsatz, all four modules, timed. Target 80%"
    checkpoint: "Goethe A1 Modellsatz, target 80%"
  - week: 10
    phase: A2
    grammar: "Subordinate clauses: weil, dass, wenn, ob. Verb goes to the end. Comma rules"
    vocab: "Opinions, feelings, reasons"
    speaking: "Give a reason for 10 things you did this week (weil)"
    saturday: "Read a forum post and pick the correct statements. Write a 50-word message giving a reason you cannot come"
  - week: 11
    phase: A2
    grammar: "Präteritum of sein, haben and modal verbs. Perfekt of separable and inseparable verbs. als versus wenn"
    vocab: "Childhood, school, past jobs"
    speaking: "Tell them about your school days, 3 minutes"
    saturday: "Write a 60-word message about a past experience"
  - week: 12
    phase: A2
    grammar: "Adjective endings after definite article. Comparative and superlative (schöner, am schönsten, besser, mehr)"
    vocab: "Clothes, appearance, shopping, comparing products"
    speaking: "Compare two phones, two cities, two foods"
    saturday: "Read a product comparison and answer. Write a 60-word message recommending one option over another"
  - week: 13
    phase: A2
    grammar: "Adjective endings after indefinite article and without article. Demonstratives dieser, jener"
    vocab: "Housing, furniture, flat search, Wohnungsanzeige vocabulary"
    speaking: "Describe your home in detail"
    saturday: "Read 4 flat adverts and match to people. Write a 60-word email to a landlord asking 3 questions"
  - week: 14
    phase: A2
    grammar: "Reflexive verbs (sich freuen, sich interessieren, sich ärgern). Verbs with fixed prepositions, part 1 (warten auf, denken an, sich freuen über)"
    vocab: "Health, sport, body, feelings"
    speaking: "Tell them what you look forward to and what annoys you"
    saturday: "Write a 60-word message to a colleague about a health problem and a changed plan"
  - week: 15
    phase: A2
    grammar: "Konjunktiv II of haben, sein, werden, können (hätte, wäre, würde, könnte) for polite requests and wishes. Indirect questions"
    vocab: "Work, office tasks, polite requests"
    speaking: "Make 5 polite requests at work in German"
    saturday: "Formal register starts: write a 60-word formal email to a company asking for information"
  - week: 16
    phase: A2
    grammar: "Genitiv: articles, -s and -es, prepositions wegen, trotz, während. Relative clauses in Nominativ and Akkusativ"
    vocab: "Travel, holidays, transport, hotel"
    speaking: "Plan a trip together in German"
    saturday: "Read a travel offer and a complaint. Write a 70-word hotel booking email"
  - week: 17
    phase: A2
    grammar: "Future with werden. Passive in present (wird gemacht). Conjunctions deshalb, trotzdem, denn, sondern"
    vocab: "News, environment, technology at a simple level"
    speaking: "Explain what will change in your job in 5 years"
    saturday: "Read a short news text. Write a 70-word opinion message with deshalb and trotzdem"
  - week: 18
    phase: A2
    grammar: "Review week. Goethe A2 format: Lesen 4 parts, Hören 4 parts, Schreiben 2 messages (informal and semi-formal), Sprechen questions, describing, planning together"
    vocab: "Review. Clean Anki: delete cards you always get right"
    speaking: "Full A2 speaking simulation, 15 minutes, including planning something together"
    saturday: "Checkpoint: Goethe A2 Modellsatz, all four modules, timed. Target 75%"
    checkpoint: "Goethe A2 Modellsatz, target 75%"
  - week: 19
    phase: B1
    grammar: "Relative clauses in Dativ and with prepositions. Plusquamperfekt. Temporal clauses: nachdem, bevor, während, seit, bis"
    vocab: "Work life, careers, applications"
    phrases: "Giving an opinion: Meiner Meinung nach, Ich bin der Ansicht, dass"
    speaking: "Describe your career path, 3 minutes"
    saturday: "Write an 80-word email to a colleague about a project"
  - week: 20
    phase: B1
    grammar: "Konjunktiv II full: würde-form, hätte, wäre, irregular forms (käme, ginge, wüsste). Unreal conditions with wenn"
    vocab: "Wishes, dreams, hypothetical situations"
    phrases: "Agreeing and disagreeing: Da stimme ich zu, Das sehe ich anders"
    speaking: "What would you do with a free year?"
    saturday: "Read two opinion texts. Write an 80-word reply to one of them"
  - week: 21
    phase: B1
    grammar: "Passive in all tenses. Passive with modal verbs. man as alternative. Verbs with fixed prepositions, part 2"
    vocab: "Media, news, technology, social media"
    phrases: "Contrasting: Einerseits, andererseits; Im Gegensatz dazu"
    speaking: "Debate: is social media good or bad?"
    saturday: "Write an 80-word forum post on a media topic"
  - week: 22
    phase: B1
    grammar: "Infinitive clauses with zu, um zu, ohne zu, anstatt zu. damit versus um zu"
    vocab: "Education, learning, the German school system"
    phrases: "Giving reasons: Das liegt daran, dass; Der Grund dafür ist"
    speaking: "Why are you learning German? Why do people change jobs?"
    saturday: "Write a 90-word formal email of enquiry about a course"
  - week: 23
    phase: B1
    grammar: "Noun-verb combinations (eine Entscheidung treffen, in Frage kommen). Word formation: prefixes and suffixes, compound nouns"
    vocab: "Consumer life, money, advertising"
    phrases: "Giving examples: Zum Beispiel, Ein Beispiel dafür ist"
    speaking: "Explain how advertising influences you"
    saturday: "Read an advertisement critically. Write a 90-word complaint email"
  - week: 24
    phase: B1
    grammar: "Konjunktiv I and indirect speech (er sagte, er habe). Reporting what others say"
    vocab: "Environment, climate, consumption"
    phrases: "Summarising: Zusammenfassend lässt sich sagen"
    speaking: "Report to them what a news story said"
    saturday: "Listen to a DW slow news item. Write a 90-word summary and your opinion"
  - week: 25
