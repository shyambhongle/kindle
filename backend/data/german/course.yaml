quiz_design:
  A1: "5 vocabulary (word to meaning, with article), 5 grammar (fill the gap), 3 sentence order, 2 listening-style (which reply fits). Examples: 'der, die or das: ___ Tisch', 'Ich ___ aus Indien (kommen)', put these 5 words in order"
  A2: "4 vocabulary, 5 grammar, 3 reading micro-texts (2 sentences, one question), 3 register (formal or informal). Examples: 'Choose the correct adjective ending', 'Which sentence has the verb in the right place after weil?'"
  B1: "3 vocabulary in context, 4 grammar transformations, 3 reading (short forum post), 3 phrase bank (which phrase fits this function), 2 error correction. Examples: 'Rewrite in Passiv', 'Which connector fits: trotzdem, deshalb or sondern', 'Find the mistake in this sentence'"
  B2: "3 vocabulary (paraphrase, synonyms), 3 Lesen-style items (paraphrase matching, as in Teil 1), 3 nominal-verbal transformations, 3 phrase bank, 3 from the learner's own error log. Examples: 'Which statement matches the text?', 'Express this with a Nomen-Verb-Verbindung', 'Formal or informal: which closing fits?'"
  Prep: "15 questions drawn only from the learner's error log and the 12 topic vocabulary pages. The learner's own mistakes, reworded"
written_design:
  A1: "One reading task (notice, short email, 5 items) plus one writing task (form or 30 to 40 word message). Marking: task done, understandable, basic word order and verb endings. 30 minutes"
  A2: "One reading task (adverts or short texts, 5 items) plus one writing task (60 to 70 words, informal or semi-formal). Marking: task points covered, connectors, adjective endings, cases. 30 minutes"
  B1: "One reading or listening task plus one writing task (80 to 100 words, forum post or formal email). Every fourth week a statistic description. Marking: Goethe B1 Schreiben criteria Erfüllung, Kohärenz, Wortschatz, Strukturen, each 0 to 5. 45 minutes"
  B2: "One full B2 task type per week as listed in the week's Saturday test. Lesen tasks timed with items; Schreiben tasks marked. Marking: Goethe B2 criteria scaled to 100; both Schreiben tasks together 60 plus 40 points. 75 minutes"
  Prep: "Schreiben both tasks (150-word forum post, 60 points; 100-word formal message, 40 points), 75 minutes, marked against the Goethe B2 criteria"
